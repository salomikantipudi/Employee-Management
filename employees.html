<!DOCTYPE html>
<html lang="en">
<head>
    <title>Employees</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: white;
            color: black;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Search */
        .search-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .search-box input {
            width: 300px;
            padding: 10px;
            border: 1px solid #999;
            border-radius: 5px;
        }

        .search-box button {
            padding: 10px 20px;
            background-color: #00bcd4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-box button:hover {
            background-color: #0097a7;
        }

        /* Employee Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #a7eaf0;
        }

        /* Edit Button */
        .edit-btn {
            background-color: #4CAF50;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
            margin-right: 5px;
        }

        /* Delete Button */
        .delete-btn {
            background-color: #f44336;
            color: white;
            padding: 7px 12px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Employee Details</h1>
    <!-- Search -->
    <div class="search-box">
        <form action="/search" method="GET">
            <input
                type="text"
                name="q"
                placeholder="Search employee..."
                value="{{ search_text or '' }}">
            <button type="submit">Search</button>
        </form>
    </div>
    <!-- Employee Table -->
    <table>
        <tr>
            <th>Employee Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Address</th>
            <th>Joining</th>
            <th>Actions</th>
        </tr>
        {% for employee in employees %}
        <tr>
            <td>{{ employee[1] }}</td>
            <td>{{ employee[2] }}</td>
            <td>{{ employee[3] }}</td>
            <td>{{ employee[4] }}</td>
            <td>{{ employee[5] }}</td>
            <td>{{ employee[6] }}</td>
            <td>{{ employee[7] }}</td>
            <td>
                <a href="/edit-employee/{{ employee[2] }}" class="edit-btn">
                    Edit
                </a>
                <a href="/delete-employee/{{ employee[2] }}"
                   class="delete-btn"
                   onclick="return confirm('Are you sure you want to delete this employee?')">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
