<!DOCTYPE html>
<html lang="en">

<head>
    <title>Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color:white;
        }

        h1 {
            text-align: center;
            color: rgb(227, 21, 21);
        }

        form {
            background-color: rgba(29, 229, 213, 0.896);
            padding: 50px;
            width: 400px;
            margin: 50px auto;
            border-radius: 10px;
        }

        label {
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
            border: none;
        }

        input[type="submit"] {
            padding: 10px 25px;
            background-color: #0508d1;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            display: block;
            margin: auto;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: rgb(210, 19, 19);
        }

        .register a {
            color: black;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        .error {
            color: black;
            text-align: center;
        }
    </style>

</head>

<body>

    <h1>LOGIN FORM</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/login" method="POST">
        <label>USERNAME:</label>
        <input id="username" name="username" type="text" required>

        <br><br>

        <label>PASSWORD:</label>
        <input id="password" name="password" type="password" required>

        <br><br>

        <input type="submit" value="Login">

        <div class="register">
            Don't have an account?
            <a href="/register">Register</a>
        </div>
    </form>
</body>
</html>
