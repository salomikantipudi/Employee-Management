<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Employee</title>
<style>
    body {
        font-family: Arial, sans-serif;
    }

    h1 {
        text-align: center;
    }

    form {
        width: 400px;
        margin: auto;
        padding: 20px;
        border: 1px solid black;
    }

    label {
        display: block;
        margin-top: 10px;
    }

    input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        box-sizing: border-box;
    }

    button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #45a049;
    }

    .back-btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 20px;
        background-color: #777;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }
</style>
</head>

<body>
<h1>Edit Employee</h1>

<form method="POST">

    <label>Employee Name:</label>
    <input type="text" name="employeename" value="{{ employee[0] }}" required>

    <label>Email:</label>
    <input type="email" name="email" value="{{ employee[1] }}" required>

    <label>Phone:</label>
    <input type="text" name="phone" value="{{ employee[2] }}" required>

    <label>Department:</label>
    <input type="text" name="department" value="{{ employee[3] }}" required>

    <label>Salary:</label>
    <input type="number" name="salary" value="{{ employee[4] }}" required>

    <label>Address:</label>
    <input type="text" name="address" value="{{ employee[5] }}" required>

    <label>Joining:</label>
    <input type="date" name="joining" value="{{ employee[6] }}" required>

    <button type="submit">UPDATE</button>

    <br>

    <a href="/" class="back-btn">BACK</a>

</form>
</body>
</html>
