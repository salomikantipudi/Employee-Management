<!DOCTYPE html>
<html lang="en">
<head>
<title>Edit Employee</title>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    }
    body{
    font-family:Arial,sans-serif;
    background-color:white;
    color:black;
    padding:30px;
    }
    h1{
    text-align:center;
    margin-bottom:25px;
    }
    .form-box{
    width:500px;
    margin:auto;
    }
    label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    }
    input{
    width:100%;
    padding:10px;
    border:1px solid #999;
    border-radius:5px;
    }
    button{
    margin-top:20px;
    padding:10px 20px;
    background-color:#4CAF50;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    }
    button:hover{
    background-color:#388E3C;
    }
    .back-btn{
    margin-left:10px;
    padding:10px 20px;
    background-color:#00bcd4;
    color:white;
    text-decoration:none;
    border-radius:5px;
    }
</style>
</head>
<body>
{% if session.get("username") %}
{% include "nav.html" %}
{% endif %}
<br>
<br>
<h1>Edit Employee</h1>
    <div class="form-box">
        <form action="/edit-employee" method="POST">
            <input type="hidden" name="email" value="{{ employee[1] }}">
            <label>Employee Name</label>
            <input type="text" name="employeename" value="{{ employee[0] }}" required>
            <label>Email</label>
            <input type="email" name="new_email" value="{{ employee[1] }}" required>
            <label>Phone</label>
            <input type="text" name="phone" value="{{ employee[2] }}" required>
            <label>Department</label>
            <input type="text" name="department" value="{{ employee[3] }}" required>
            <label>Salary</label>
            <input type="number" name="salary" value="{{ employee[4] }}" required>
            <label>Address</label>
            <input type="text" name="address" value="{{ employee[5] }}" required>
            <label>Joining</label>
            <input type="date" name="joining" value="{{ employee[6] }}" required>
            <button type="submit">Update Employee</button>
            <a href="/employees" class="back-btn">Back</a>
        </form>
    </div>
</body>
</html>
